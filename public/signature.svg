<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 140" width="350" height="140">
  <!-- Handwritten Calligraphic Signature: أحمد إبراهيم -->
  <g fill="none" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Word 1: أحمد -->
    <!-- Alif -->
    <path d="M 60,32 C 62,45 61,65 60,82 C 60,83 58,70 59,50" />
    <!-- Hamza above Alif -->
    <path d="M 57,20 C 62,18 66,22 62,26 C 60,28 56,27 61,29" stroke-width="3.5" />

    <!-- Ha + Meem + Dal -->
    <path d="M 75,55 C 85,45 105,52 115,55 C 122,58 130,50 138,48 C 145,46 150,52 142,60 C 135,66 125,62 135,58 C 148,54 165,58 175,56 C 182,54 185,42 182,35 C 180,30 178,42 188,58" />

    <!-- Word 2: إبراهيم -->
    <!-- Alif with Hamza below -->
    <path d="M 198,30 C 200,45 199,62 198,75" />
    <path d="M 197,82 C 201,80 203,84 200,87 C 198,88 196,87 199,89" stroke-width="3" />

    <!-- Baa + Raa + Alif + Ha + Meem -->
    <path d="M 212,58 C 218,52 225,56 230,68 C 235,80 232,88 226,92 C 222,94 220,86 228,70 C 238,50 252,38 256,32 C 257,30 255,48 256,66" />

    <!-- Ya + Meem connected tail -->
    <path d="M 268,60 C 275,56 285,62 292,58 C 298,55 305,62 300,70 C 295,78 285,74 290,68 C 298,60 315,62 325,60" />
    
    <!-- Dots for Ya -->
    <circle cx="282" cy="74" r="2" fill="#1d4ed8" stroke="none" />
    <circle cx="289" cy="74" r="2" fill="#1d4ed8" stroke="none" />

    <!-- Underline Loop Flourish -->
    <path d="M 320,65 C 280,105 180,115 100,112 C 50,110 35,98 50,90 C 70,82 180,80 260,78" stroke-width="4" />
  </g>
</svg>
